name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/patrickcoleman/blogapi:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            docker pull ghcr.io/patrickcoleman/blogapi:latest

            docker stop blogapi 2>/dev/null || true
            docker rm blogapi 2>/dev/null || true

            docker run -d \
              --name blogapi \
              -p 3000:3000 \
              --restart=unless-stopped \
              --env ALLOWED_ORIGIN=${{ secrets.ALLOWED_ORIGIN }} \
              ghcr.io/patrickcoleman/blogapi:latest